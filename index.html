<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="src/images/logo/icon.png" />
    <title>Главная страница</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  
</head>


<body>
    <div class="home-page">
        <header>
            <section class="header">
                <h1>Текст хеддера</h1>
            </section>
        </header>

        <main>
            <div class="list content-">
                <h1>Заголовок</h1>
                <ul>
                    <li>текст 1</li>
                    <li>текст 2</li>
                    <li>текст 3</li>
                </ul>
            </div>
            <div class="main content">
                <h1>Заголовок мейн блока</h1>
                <p id="greeting">Hello, World!</p>
                <button id="changeGreetingBtn">Сменить приветствие</button>
            </div>
            <div class="third content">
                <h1> Что то </h1>
                <img class="ribombee" src="src/images/some-stuff/icon2.png">
            </div>

        </main>
        <footer>
            <section class="about">
                <form action="https://t.me/control_ward" target="_blank" method="get">
                    <button class="info-tg">
                        <span>
                            Telegram
                        </span>
                    </button>
                </form>
            </section>

        </footer>
    </div>



    <script>
        const greetingElement = document.getElementById('greeting');
        const button = document.getElementById('changeGreetingBtn');

        button.addEventListener('click', function () {
            if (greetingElement.textContent === 'Hello, World!') {
                greetingElement.textContent = 'Hello, FEFU!';
            } else {
                greetingElement.textContent = 'Hello, World!';
            }
        });
    </script>
</body>

</html>
